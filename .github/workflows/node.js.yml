git adname: crm-academy-idearoom

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.15.1]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_TEMPO: ${{ secrets.NEXT_PUBLIC_TEMPO }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # - name: Check Docker installation
      #   run: |
      #     docker --version || (echo "❌ Docker is not installed" && exit 1)
      #     docker info || (echo "❌ Docker daemon is not running" && exit 1)

      - name: Create dedicated admin panel network if it doesn't exist
        run: |
          docker network inspect idearoom-admin-network >/dev/null 2>&1 || \
          docker network create \
            --driver bridge \
            --attachable=true \
            idearoom-admin-network

      - name: Stop and remove existing container
        run: |
          docker stop crm-academy-idearoom || true
          docker rm crm-academy-idearoom || true
          docker rmi crm-academy-idearoom:latest || true

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_BASE_URL="${{ secrets.NEXT_PUBLIC_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_TEMPO="${{ secrets.NEXT_PUBLIC_TEMPO }}" \
            -t crm-academy-idearoom:latest .
        env:
          DOCKER_BUILDKIT: 1

      - name: Run Docker container
        run: |
          docker run -d \
            --name crm-academy-idearoom \
            --restart unless-stopped \
            --network idearoom-admin-network \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -e NEXT_PUBLIC_BASE_URL="${{ secrets.NEXT_PUBLIC_BASE_URL }}" \
            -e NEXT_PUBLIC_TEMPO="${{ secrets.NEXT_PUBLIC_TEMPO }}" \
            crm-academy-idearoom:latest

      - name: Verify container is running
        run: |
          sleep 5
          if docker ps | grep -q crm-academy-idearoom; then
            echo "✅ Container is running"
            docker logs crm-academy-idearoom --tail 30
          else
            echo "❌ Container failed to start"
            docker ps -a | grep crm-academy-idearoom
            docker logs crm-academy-idearoom --tail 50 || true
            exit 1
          fi
